<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEXUM — 新規登録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#F4FAFB;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1A2E2C}
.box{background:#fff;border:1px solid #B2DCDB;border-radius:14px;box-shadow:0 8px 30px rgba(13,148,136,.12);width:100%;max-width:400px;padding:28px}
.brand{font-size:22px;font-weight:800;color:#0D9488;letter-spacing:.05em}
.sub{font-size:10px;color:#9CA3AF;letter-spacing:.15em;margin:2px 0 6px}
h1{font-size:15px;font-weight:700;margin:14px 0 18px}
label{display:block;font-size:11px;font-weight:700;color:#6B7280;margin:12px 0 5px}
input{width:100%;padding:10px 12px;border:1.5px solid #B2DCDB;border-radius:6px;font-size:14px;font-family:inherit;outline:none}
input:focus{border-color:#0D9488}
button{width:100%;margin-top:20px;padding:11px;background:#0D9488;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6}
.msg{margin-top:12px;font-size:12px;min-height:16px;line-height:1.6}
.msg.err{color:#EF4444}.msg.ok{color:#10B981}
.hint{margin-top:8px;font-size:11px;color:#9CA3AF;line-height:1.6}
.foot{margin-top:18px;border-top:1px solid #E5E7EB;padding-top:14px;font-size:12px;color:#6B7280}
.foot a{color:#0D9488;font-weight:700;text-decoration:none}
.warn{margin-top:14px;background:#FEF3C7;border:1px solid #F59E0B;border-radius:8px;padding:9px 12px;font-size:11px;color:#92400E}
</style>
</head>
<body>
<div class="box">
  <div class="brand">VEXUM</div>
  <div class="sub">TASK MANAGEMENT SYSTEM</div>
  <h1>新規登録（従業員）</h1>
  <form id="signup">
    <label>氏名</label>
    <input id="name" type="text" placeholder="山田 太郎" autocomplete="name">
    <label>メールアドレス</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <label>パスワード（6文字以上）</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
    <label>パスワード（確認）</label>
    <input id="password2" type="password" placeholder="••••••••" autocomplete="new-password">
    <button id="btn" type="submit">登録する</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="hint">登録すると「メンバー（未所属）」として登録され、管理者がチームに割り当てます。</div>
  <div class="warn" id="warn" style="display:none">Supabase未設定です。管理者にお問い合わせください。</div>
  <div class="foot">すでにアカウントをお持ちですか？ <a href="./index.html">ログインはこちら</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./web/config.js" onerror="this.dataset.miss=1"></script>
<script src="./web/api.js"></script>
<script>
(function(){
  var API = window.VexumAPI || {};
  if(!API.ready){ document.getElementById('warn').style.display='block'; }
  document.getElementById('signup').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg=document.getElementById('msg'); msg.className='msg'; msg.textContent='';
    var name=document.getElementById('name').value.trim();
    var email=document.getElementById('email').value.trim();
    var pw=document.getElementById('password').value;
    var pw2=document.getElementById('password2').value;
    if(!name){ msg.className='msg err'; msg.textContent='氏名を入力してください'; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.className='msg err'; msg.textContent='メールアドレスの形式が正しくありません'; return; }
    if(pw.length<6){ msg.className='msg err'; msg.textContent='パスワードは6文字以上にしてください'; return; }
    if(pw!==pw2){ msg.className='msg err'; msg.textContent='パスワード（確認）が一致しません'; return; }
    if(!API.ready){ msg.className='msg err'; msg.textContent='Supabase未設定のため登録できません'; return; }
    var btn=document.getElementById('btn'); btn.disabled=true;
    try{
      // メール確認不要のセルフ登録RPC（確認済みユーザーを作成）
      var reg=await API.sb.rpc('vexum_self_register', { p_email:email, p_password:pw, p_name:name });
      if(reg.error){ throw reg.error; }
      // そのままログインして個人画面へ
      var s=await API.sb.auth.signInWithPassword({ email:email, password:pw });
      if(!s.error){
        msg.className='msg ok'; msg.textContent='登録が完了しました。個人画面へ移動します…';
        setTimeout(function(){ location.href='./employee.html'; }, 1000);
      }else{
        msg.className='msg ok';
        msg.innerHTML='登録が完了しました。<a href="./index.html">ログイン</a>してください。';
        btn.disabled=false;
      }
    }catch(ex){
      var m=(ex.message||String(ex));
      if(/already/i.test(m)) m='このメールアドレスは既に登録されています';
      else if(/too short/i.test(m)) m='パスワードは6文字以上にしてください';
      else if(/invalid email/i.test(m)) m='メールアドレスの形式が正しくありません';
      msg.className='msg err'; msg.textContent='登録失敗: '+m;
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
